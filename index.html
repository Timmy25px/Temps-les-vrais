<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compteur</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #5865F2, #404EED, #2b2d31);
    font-family: 'Segoe UI', sans-serif;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.container {
    text-align: center;
    width: 95%;
}

.counter {
    display: flex;
    justify-content: center;
    gap: 2vw;
    flex-wrap: wrap;
}

.block {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.number {
    font-size: clamp(20px, 6vw, 70px);
    font-weight: bold;
    background: rgba(0,0,0,0.2);
    padding: 10px 15px;
    border-radius: 12px;
    min-width: 70px;
    text-align: center;
    box-shadow: 0 0 15px rgba(88,101,242,0.6);
}

.label {
    margin-top: 8px;
    font-size: clamp(10px, 1.5vw, 14px);
    opacity: 0.8;
    letter-spacing: 1px;
}

/* Popup */
.popup {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    padding: 15px 25px;
    border-radius: 15px;
    font-size: 2vw;
    box-shadow: 0 0 20px #5865F2;
    display: none;
}

@media (max-width: 600px) {
    .popup {
        font-size: 5vw;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="popup" id="popup"></div>

    <div class="counter">
        <div class="block"><div class="number" id="years">0</div><div class="label">ANNÉES</div></div>
        <div class="block"><div class="number" id="days">0</div><div class="label">JOURS</div></div>
        <div class="block"><div class="number" id="hours">0</div><div class="label">HEURES</div></div>
        <div class="block"><div class="number" id="minutes">0</div><div class="label">MINUTES</div></div>
        <div class="block"><div class="number" id="seconds">0</div><div class="label">SECONDES</div></div>
    </div>

</div>

<script>

const startDate = new Date(2023, 3, 5, 11, 55, 0); // 5 avril 2023
let lastPopupYear = null;

function getNextAnniversary(now) {
    let year = now.getFullYear();
    let next = new Date(year, 3, 5, 0, 0, 0);

    if (now >= next) {
        next = new Date(year + 1, 3, 5, 0, 0, 0);
    }

    return next;
}

function updateCounter() {
    const now = new Date();

    let years = now.getFullYear() - startDate.getFullYear();

    const anniversaryThisYear = new Date(now.getFullYear(), 3, 5);

    if (now < anniversaryThisYear) {
        years--;
    }

    // Calcul depuis dernier anniversaire
    let lastAnniversary = new Date(now.getFullYear(), 3, 5);
    if (now < lastAnniversary) {
        lastAnniversary = new Date(now.getFullYear() - 1, 3, 5);
    }

    let diff = now - lastAnniversary;

    let seconds = Math.floor(diff / 1000);
    let days = Math.floor(seconds / 86400);
    seconds %= 86400;

    let hours = Math.floor(seconds / 3600);
    seconds %= 3600;

    let minutes = Math.floor(seconds / 60);
    seconds %= 60;

    document.getElementById("years").textContent = years;
    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = String(hours).padStart(2,'0');
    document.getElementById("minutes").textContent = String(minutes).padStart(2,'0');
    document.getElementById("seconds").textContent = String(seconds).padStart(2,'0');

    handlePopup(now);
}

function handlePopup(now) {
    const popup = document.getElementById("popup");
    const nextAnniv = getNextAnniversary(now);
    const diff = (nextAnniv - now) / 1000;

    if (diff <= 10 && diff > 0) {
        popup.style.display = "block";
        popup.textContent = "Anniversaire dans " + Math.ceil(diff) + "s";
    } else if (diff <= 0 && lastPopupYear !== nextAnniv.getFullYear()) {
        popup.style.display = "block";
        popup.textContent = "🎉 ANNIVERSAIRE !";
        lastPopupYear = nextAnniv.getFullYear();

        setTimeout(() => {
            popup.style.display = "none";
        }, 4000);
    } else {
        popup.style.display = "none";
    }
}

setInterval(updateCounter, 1000);
updateCounter();

</script>

</body>
</html>
