<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compteur</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #5865F2, #404EED, #2b2d31);
    font-family: 'Segoe UI', sans-serif;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.container {
    text-align: center;
    width: 95%;
}

.counter {
    display: flex;
    justify-content: center;
    gap: 2vw;
    flex-wrap: wrap;
}

.block {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.number {
    font-size: clamp(20px, 6vw, 70px);
    font-weight: bold;
    background: rgba(0,0,0,0.2);
    padding: 10px 15px;
    border-radius: 12px;
    min-width: 70px;
    text-align: center;
    box-shadow: 0 0 15px rgba(88,101,242,0.6);
}

.label {
    margin-top: 8px;
    font-size: clamp(10px, 1.5vw, 14px);
    opacity: 0.8;
    letter-spacing: 1px;
}

/* Popup */
.popup {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    padding: 15px 25px;
    border-radius: 15px;
    font-size: 2vw;
    box-shadow: 0 0 20px #5865F2;
    display: none;
}

@media (max-width: 600px) {
    .popup {
        font-size: 5vw;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="popup" id="popup"></div>

    <div class="counter">
        <div class="block"><div class="number" id="years">0</div><div class="label">ANNÉE(S)</div></div>
        <div class="block"><div class="number" id="days">0</div><div class="label">JOUR(S)</div></div>
        <div class="block"><div class="number" id="hours">0</div><div class="label">HEURE(S)</div></div>
        <div class="block"><div class="number" id="minutes">0</div><div class="label">MINUTE(S)</div></div>
        <div class="block"><div class="number" id="seconds">0</div><div class="label">SECONDE(S)</div></div>
    </div>

</div>

<script>

// Date de départ exacte : 05 avril 2023 à 11:57:00
const startDate = new Date(2023, 3, 5, 11, 57, 0);

let lastPopupYear = null;

function getNextAnniversary(now) {
    let year = now.getFullYear();

    let next = new Date(
        year,
        startDate.getMonth(),
        startDate.getDate(),
        startDate.getHours(),
        startDate.getMinutes(),
        startDate.getSeconds()
    );

    if (now >= next) {
        next = new Date(
            year + 1,
            startDate.getMonth(),
            startDate.getDate(),
            startDate.getHours(),
            startDate.getMinutes(),
            startDate.getSeconds()
        );
    }

    return next;
}
    function updateCounter() {
    const now = new Date();

    // Calcul précis des années selon le calendrier grégorien
    let years = now.getFullYear() - startDate.getFullYear();

    let anniversary = new Date(
        now.getFullYear(),
        startDate.getMonth(),
        startDate.getDate(),
        startDate.getHours(),
        startDate.getMinutes(),
        startDate.getSeconds()
    );

    if (now < anniversary) {
        years--;
    }

    // Dernier anniversaire exact (avec heure 11:57)
    let lastAnniversary = new Date(
        now.getFullYear(),
        startDate.getMonth(),
        startDate.getDate(),
        startDate.getHours(),
        startDate.getMinutes(),
        startDate.getSeconds()
    );

    if (now < lastAnniversary) {
        lastAnniversary = new Date(
            now.getFullYear() - 1,
            startDate.getMonth(),
            startDate.getDate(),
            startDate.getHours(),
            startDate.getMinutes(),
            startDate.getSeconds()
        );
    }

    // Temps restant depuis le dernier anniversaire
    let diff = now - lastAnniversary;

    let totalSeconds = Math.floor(diff / 1000);

    let days = Math.floor(totalSeconds / 86400);
    totalSeconds %= 86400;

    let hours = Math.floor(totalSeconds / 3600);
    totalSeconds %= 3600;

    let minutes = Math.floor(totalSeconds / 60);
    let seconds = totalSeconds % 60;


    document.getElementById("years").textContent = years;
    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = String(hours).padStart(2,'0');
    document.getElementById("minutes").textContent = String(minutes).padStart(2,'0');
    document.getElementById("seconds").textContent = String(seconds).padStart(2,'0');

    handlePopup(now);
}


function handlePopup(now) {

    const popup = document.getElementById("popup");

    const nextAnniv = getNextAnniversary(now);

    const diff = (nextAnniv - now) / 1000;


    if (diff <= 10 && diff > 0) {

        popup.style.display = "block";

        popup.textContent =
            "Anniversaire dans " + Math.ceil(diff) + "s";


    } else if (diff <= 0 && lastPopupYear !== nextAnniv.getFullYear()) {

        popup.style.display = "block";

        popup.textContent = "🎉 ANNIVERSAIRE !";

        lastPopupYear = nextAnniv.getFullYear();


        setTimeout(() => {

            popup.style.display = "none";

        }, 4000);


    } else {

        popup.style.display = "none";

    }

}
    setInterval(updateCounter, 1000);

updateCounter();

</script>

</body>
</html>
